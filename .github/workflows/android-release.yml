name: Signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    env:
      SEAFROGS_RELEASE_KEYSTORE: ${{ runner.temp }}/seafrogs-release.jks
      SEAFROGS_RELEASE_STORE_PASSWORD: ${{ secrets.SEAFROGS_RELEASE_STORE_PASSWORD }}
      SEAFROGS_RELEASE_KEY_ALIAS: ${{ secrets.SEAFROGS_RELEASE_KEY_ALIAS }}
      SEAFROGS_RELEASE_KEY_PASSWORD: ${{ secrets.SEAFROGS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Restore the private release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SEAFROGS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$SEAFROGS_RELEASE_STORE_PASSWORD"
          test -n "$SEAFROGS_RELEASE_KEY_ALIAS"
          test -n "$SEAFROGS_RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SEAFROGS_RELEASE_KEYSTORE"
      - name: Install the pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Check and build the production APK and Play bundle
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify signature, alignment and artifact hashes
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab > app/build/outputs/SHA256SUMS.txt
      - name: Retain signed deliverables and validation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seafrogs-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/SHA256SUMS.txt
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
          if-no-files-found: error
      - name: Remove the private key
        if: always()
        run: rm -f "$SEAFROGS_RELEASE_KEYSTORE"
